<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>星际征途</title>
<script>
(function(){function b(e){const k=e.key||'';const c=e.ctrlKey||e.metaKey;const s=e.shiftKey;if(k==='F12'||(c&&s&&(k==='I'||k==='i'))||(c&&(k==='U'||k==='u'))||(c&&(k==='S'||k==='s'))){e.preventDefault();e.stopPropagation();return false}return true}
document.addEventListener('keydown',b,true);
document.addEventListener('contextmenu',e=>{e.preventDefault();e.stopPropagation();return false},true);
document.addEventListener('dragstart',e=>{e.preventDefault();return false},true);
document.addEventListener('selectstart',e=>{e.preventDefault();return false},true)})();
</script>
<style>
:root{--bg:#080c1a;--bg2:#0a1022;--bgp:#0b1422;--bgb:#141e32;--bgi:#0b1422;--bd:#1a2842;--bl:#2a4065;--tx:#c8d6e5;--ts:#6f8bb0;--th:#e8f0ff;--gold:#d4a843;--grn:#4aad7a;--red:#c0392b}
body.light{--bg:#e8eef7;--bg2:#f0f4fa;--bgp:#fff;--bgb:#fff;--bgi:#f5f8fc;--bd:#c8d6e5;--bl:#a8b8d0;--tx:#2a3a50;--ts:#6a7a90;--th:#1a2a40}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;font-family:'Segoe UI',system-ui,sans-serif}
html,body{width:100%;height:100%;background:var(--bg);color:var(--tx);overflow:hidden}
#app{width:100vw;height:100vh;display:flex;flex-direction:column;background:var(--bg2);overflow:hidden}
#themeToggle{position:fixed;top:50px;right:10px;z-index:999;background:var(--bgp);border:1px solid var(--bl);border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:1rem;color:var(--tx)}
#themeToggle:hover{border-color:var(--gold)}

.login-overlay{position:fixed;inset:0;background:rgba(8,12,26,.96);backdrop-filter:blur(8px);display:flex;justify-content:center;align-items:center;z-index:2000;transition:opacity .5s}
.login-overlay.hidden{opacity:0;pointer-events:none}
.login-box{background:var(--bgb);border-radius:20px;padding:36px 44px;max-width:440px;width:90%;border:1px solid var(--bl);box-shadow:0 30px 60px rgba(0,0,0,.9)}
.login-box h1{font-size:2rem;color:var(--gold);margin-bottom:4px;letter-spacing:2px;text-align:center}
.login-box .sub{color:var(--ts);font-size:.85rem;margin-bottom:20px;text-align:center}
.login-box .field{margin-bottom:12px}
.login-box .field label{display:block;font-size:.7rem;color:var(--ts);margin-bottom:3px}
.login-box .field input{width:100%;padding:10px 14px;background:var(--bgi);border:1px solid var(--bd);border-radius:8px;color:var(--th);font-size:.95rem;outline:none}
.login-box .login-btn{width:100%;padding:11px;margin-top:6px;background:#2a5a7a;border:none;border-radius:8px;color:#fff;font-size:1rem;font-weight:600;cursor:pointer}
.login-box .login-btn:hover{background:#3a6a8a}
.login-box .error{color:var(--red);font-size:.75rem;margin-top:6px;min-height:20px;text-align:center}
.login-box .success{color:var(--grn);font-size:.75rem;margin-top:6px;min-height:20px;text-align:center}
.login-box .toggle-mode{text-align:center;margin-top:12px;font-size:.75rem;color:var(--ts);cursor:pointer}
.login-box .toggle-mode span{color:#4a8aaa;text-decoration:underline}

.top-bar{display:flex;justify-content:space-between;align-items:center;background:var(--bgp);padding:4px 18px;border-bottom:1px solid var(--bd);flex-shrink:0;height:46px;z-index:10}
.user-info{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.user-avatar{width:30px;height:30px;border-radius:50%;background:#2e6b9e;border:2px solid #4a7aad}
.user-name{font-weight:700;font-size:.9rem;color:var(--th)}
.user-level{font-size:.6rem;color:var(--gold);background:rgba(212,168,67,.12);padding:0 12px;border-radius:30px;border:1px solid rgba(212,168,67,.2)}
.resources{display:flex;gap:14px;font-size:.7rem;align-items:center;flex-wrap:wrap}
.resources span{display:flex;align-items:center;gap:4px;color:var(--ts)}
.resources .val{color:var(--th);font-weight:600}
.resources .val.gold{color:var(--gold)}
#syncStatus{font-size:.5rem;padding:2px 8px;border-radius:10px;background:#0f182a}
#syncStatus.ok{color:var(--grn);border:1px solid #2a6a4a}
#syncStatus.sync{color:var(--gold);border:1px solid #7a6a2a;animation:pulse .8s infinite}
#syncStatus.fail{color:var(--red);border:1px solid #6a2a2a}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

.main-body{display:flex;flex:1;overflow:hidden}
.left-panel{width:260px;min-width:200px;background:var(--bgp);border-right:1px solid var(--bd);padding:6px 10px;overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column;gap:5px}
.left-panel::-webkit-scrollbar{width:3px}.left-panel::-webkit-scrollbar-thumb{background:var(--bl);border-radius:10px}
.panel-section{background:rgba(15,24,42,.5);border-radius:6px;padding:6px 10px;border:1px solid var(--bd)}
.panel-section .section-title{font-size:.55rem;color:var(--ts);text-transform:uppercase;margin-bottom:3px;display:flex;justify-content:space-between}

.galaxy-container{display:flex;flex-direction:column;gap:6px}
.galaxy-group{border:1px solid var(--bd);border-radius:4px;overflow:hidden}
.galaxy-header{background:#0f182a;padding:3px 8px;font-size:.55rem;color:var(--gold);cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.galaxy-header:hover{background:var(--bd)}
.galaxy-header .g-tier{font-size:.4rem;color:#4a6080}
.galaxy-header .g-arrow{font-size:.4rem;color:#4a6080;transition:.2s}
.galaxy-header .g-arrow.open{transform:rotate(90deg)}
.galaxy-systems{display:flex;flex-wrap:wrap;gap:2px;padding:4px 6px;background:var(--bgp);max-height:0;overflow:hidden;transition:max-height .3s}
.galaxy-systems.open{max-height:300px;overflow-y:auto}
.system-chip{font-size:.4rem;padding:1px 8px;border-radius:30px;background:#0f182a;border:1px solid var(--bd);color:var(--ts);cursor:pointer;white-space:nowrap}
.system-chip:hover{border-color:#3a5380}
.system-chip.active{border-color:#4a7aad;color:var(--th);background:var(--bd)}
.system-chip .s-lvl{font-size:.35rem;color:#4a6080}

.warehouse-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;max-height:120px;overflow-y:auto}
.warehouse-slot{background:var(--bgp);border:1px solid var(--bd);border-radius:3px;padding:2px;text-align:center;font-size:.4rem;min-height:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:var(--ts)}
.warehouse-slot:hover{border-color:#3a5380}
.warehouse-slot .name{font-size:.4rem;font-weight:500}
.warehouse-slot .info-row{display:flex;gap:2px;font-size:.35rem;color:#4a6080}
.warehouse-slot.has-item{border-color:#3a5380}
.warehouse-slot.blueprint{border-color:var(--gold);background:rgba(212,168,67,.08)}
.q-1{color:#8fa5c9;border-color:#3a4a5a}.q-1 .name{color:#8fa5c9}
.q-2{color:var(--grn);border-color:#2a6a4a}.q-2 .name{color:var(--grn)}
.q-3{color:#4a8aaa;border-color:#2a5a7a}.q-3 .name{color:#4a8aaa}
.q-4{color:#8e44ad;border-color:#5a2a7a}.q-4 .name{color:#8e44ad}
.q-5{color:var(--gold);border-color:#7a6a2a}.q-5 .name{color:var(--gold)}
.q-6{color:#d4853a;border-color:#7a4a2a}.q-6 .name{color:#d4853a}
.q-7{color:#c06a9a;border-color:#7a3a5a}.q-7 .name{color:#c06a9a}

.fleet-summary{display:flex;gap:3px;flex-wrap:wrap}
.fleet-tag{font-size:.45rem;padding:1px 6px;border-radius:8px;border:1px solid var(--bd);color:var(--ts)}
.fleet-tag.front{border-color:var(--red);color:#e67a6a}
.fleet-tag.mid{border-color:var(--gold);color:#e8c84a}
.fleet-tag.rear{border-color:#27ae60;color:#5dcc8a}
.btn-sm{font-size:.45rem;padding:1px 8px;background:var(--bd);border:1px solid #3a5380;border-radius:30px;color:var(--th);cursor:pointer}
.btn-sm:hover{border-color:#4a7aad}
.btn-large{font-size:.6rem;padding:4px 12px;background:var(--bd);border:1px solid #4a7aad;border-radius:30px;color:var(--th);cursor:pointer;width:100%;text-align:center;font-weight:600}
.btn-large:hover{background:#2a3a5a}

.center-panel{flex:1;display:flex;flex-direction:column;padding:6px 14px;overflow:hidden;min-width:0}
.battle-header{display:flex;justify-content:space-between;align-items:center;font-size:.65rem;color:var(--ts);flex-shrink:0;margin-bottom:3px;flex-wrap:wrap;gap:2px}
.battle-header .location{color:var(--th);font-weight:600}
.battlefield{flex:1;display:flex;justify-content:center;align-items:stretch;gap:10px;min-height:0;padding:3px 0}
.friendly-column{display:flex;flex-direction:column-reverse;justify-content:center;gap:5px;width:150px}
.friendly-unit{display:flex;align-items:center;gap:4px;background:rgba(10,20,40,.5);border-radius:4px;padding:3px 6px;border:1px solid #1a2a4a;height:34px;cursor:pointer;font-size:.5rem}
.friendly-unit .pos-tag{font-size:.35rem;padding:0 3px;border-radius:4px;background:var(--bd);color:var(--ts);min-width:18px;text-align:center}
.friendly-unit .pos-tag.front{background:#3a1a1a;color:#e67a6a}
.friendly-unit .pos-tag.mid{background:#3a3a1a;color:#e8c84a}
.friendly-unit .pos-tag.rear{background:#1a3a2a;color:#5dcc8a}
.friendly-unit .ship-name{font-size:.45rem;color:#9bb3d9;white-space:nowrap}
.friendly-unit .hp-bar{flex:1;height:3px;background:#1a2a3a;border-radius:4px;overflow:hidden;min-width:24px}
.friendly-unit .hp-bar .fill{height:100%;background:var(--grn);border-radius:4px}
.friendly-unit .hp-text{font-size:.35rem;color:#6a8aaa;min-width:24px;text-align:right}
.friendly-unit .charge-bar{flex:1;height:2px;background:#1a1a2a;border-radius:4px;overflow:hidden;min-width:14px}
.friendly-unit .charge-bar .fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--red));border-radius:4px}

.vs-divider{display:flex;justify-content:center;align-items:center;width:12px;border-left:1px solid rgba(42,64,101,.15);border-right:1px solid rgba(42,64,101,.15)}
.vs-divider span{font-size:.5rem;color:#3a5380;writing-mode:vertical-lr;letter-spacing:2px}
.enemy-column{display:flex;flex-direction:column;justify-content:center;gap:5px;width:150px}
.enemy-unit{display:flex;align-items:center;gap:4px;background:rgba(20,10,10,.4);border-radius:4px;padding:3px 6px;border:1px solid #2a1a1a;height:34px;flex-direction:row-reverse;font-size:.5rem}
.enemy-unit .ship-name{font-size:.45rem;color:#e6a0a0;white-space:nowrap}
.enemy-unit .hp-bar{flex:1;height:3px;background:#2a1a1a;border-radius:4px;overflow:hidden;min-width:24px}
.enemy-unit .hp-bar .fill{height:100%;background:var(--red);border-radius:4px}
.enemy-unit .hp-text{font-size:.35rem;color:#8a6a6a;min-width:24px}

.battle-footer{display:flex;gap:6px;flex-shrink:0;padding-top:4px;border-top:1px solid var(--bd);margin-top:3px;flex-wrap:wrap;min-height:50px}
.battle-log-mini{flex:2;font-size:.55rem;color:#6a8aaa;max-height:50px;overflow-y:auto;background:#080c18;border-radius:4px;padding:3px 10px;border:1px solid #121c2e;min-width:100px}
.battle-log-mini div{padding:1px 0;border-bottom:1px solid #0f182a}
.battle-log-mini .dmg{color:var(--red)}.battle-log-mini .heal{color:var(--grn)}.battle-log-mini .sys{color:#4a8aaa}.battle-log-mini .loot{color:var(--gold)}.battle-log-mini .blueprint{color:#e67e22;font-weight:600}.battle-log-mini .affix{color:#9b59b6}.battle-log-mini .exp{color:var(--grn)}

.action-buttons{display:flex;gap:3px;flex-wrap:wrap}
.btn{background:var(--bd);border:1px solid #3a5380;border-radius:30px;padding:3px 12px;color:var(--th);font-size:.55rem;font-weight:600;cursor:pointer}
.btn-success{background:#1f6a3a;border-color:#3a8a5a}.btn-success:hover{background:#2a7a4a}
.btn-gold{background:#6a5a2a;border-color:#8a7a3a}.btn-gold:hover{background:#7a6a3a}
.btn-purple{background:#4a2a6a;border-color:#6a3a8a}.btn-purple:hover{background:#5a3a7a}
.btn-danger{background:#6a2a2a;border-color:#8a3a3a}.btn-danger:hover{background:#7a3a3a}

.right-panel{width:280px;min-width:220px;background:var(--bgp);border-left:1px solid var(--bd);padding:6px 10px;overflow:hidden;flex-shrink:0;display:flex;flex-direction:column}
.nav-tabs{display:flex;gap:2px;margin-bottom:3px;flex-wrap:wrap}
.nav-tab{padding:2px 10px;font-size:.5rem;border-radius:4px 4px 0 0;cursor:pointer;background:#0f182a;color:var(--ts);border:1px solid var(--bd);border-bottom:none}
.nav-tab.active{background:var(--bd);color:var(--th);border-color:#3a5380}
.tab-content{display:none;flex-direction:column;flex:1;overflow:hidden}
.tab-content.active{display:flex}
.page-container{flex:1;overflow:hidden;display:flex;flex-direction:column}
.page-tabs{display:flex;gap:2px;border-bottom:1px solid var(--bd);flex-shrink:0}
.page-tab{padding:3px 12px;font-size:.6rem;cursor:pointer;color:var(--ts);border-bottom:2px solid transparent}
.page-tab.active{color:var(--th);border-bottom-color:var(--gold)}
.page-body{flex:1;overflow:hidden;padding-top:4px}
.page-content{display:none;height:100%;flex-direction:column;overflow:hidden}
.page-content.active{display:flex}
.trade-search{display:flex;gap:4px;flex-shrink:0;margin-bottom:4px}
.trade-search input{flex:1;background:var(--bgi);border:1px solid var(--bd);border-radius:4px;padding:3px 8px;color:var(--th);font-size:.55rem;outline:none}
.trade-search select{background:var(--bgi);border:1px solid var(--bd);border-radius:4px;padding:3px 6px;color:var(--th);font-size:.5rem}
.trade-list-page{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px;padding-right:3px}
.trade-item-page{display:flex;justify-content:space-between;align-items:center;background:var(--bgp);border-radius:3px;padding:3px 8px;border:1px solid var(--bd);font-size:.55rem;flex-shrink:0}
.trade-item-page .info{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.trade-item-page .name{color:var(--th);font-weight:500}
.trade-item-page .btn-page{padding:1px 10px;font-size:.45rem;border-radius:20px;border:none;cursor:pointer;background:#2a5a7a;color:#fff;height:18px}
.trade-item-page .btn-page.delist{background:#5a3a3a}
.trade-empty-page{color:#4a6080;text-align:center;padding:20px 0;font-size:.6rem}
.trade-pagination{display:flex;gap:4px;justify-content:center;padding:4px 0}
.trade-pagination button{background:var(--bgp);border:1px solid var(--bd);border-radius:3px;padding:1px 10px;color:var(--ts);cursor:pointer;font-size:.45rem}

.rank-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px;padding-right:3px}
.rank-item{display:flex;align-items:center;gap:8px;padding:3px 8px;background:var(--bgp);border-radius:3px;border:1px solid var(--bd);font-size:.55rem}
.rank-item .rank-num{width:24px;color:#4a6080;font-weight:600;text-align:center;font-size:.5rem}
.rank-item .rank-num.top1{color:var(--gold)}
.rank-item .rank-num.top2{color:#8fa5c9}
.rank-item .rank-num.top3{color:#d4853a}
.rank-item .rank-avatar{width:22px;height:22px;border-radius:50%;background:var(--bd);border:1px solid #3a5380}
.rank-item .rank-name{flex:1;color:var(--th)}
.rank-item .rank-score{color:var(--gold);font-weight:600}

.factory-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px 0}
.factory-item{background:var(--bgp);border:1px solid var(--bd);border-radius:4px;padding:6px 8px;text-align:center;position:relative;padding-bottom:24px}
.factory-item.dim{opacity:.5}
.factory-item .fname{color:var(--th);font-weight:600;font-size:.6rem}
.factory-item .ftier{font-size:.45rem;color:#4a6080}
.factory-item .fprogress{height:4px;background:var(--bd);border-radius:4px;margin:4px 0;overflow:hidden}
.factory-item .fprogress .fill{height:100%;background:linear-gradient(90deg,var(--gold),#e67e22);border-radius:4px}
.factory-item .build-btn{position:absolute;bottom:3px;right:3px;font-size:.4rem;padding:2px 8px;border-radius:20px;background:var(--grn);color:#fff;border:none;cursor:pointer}
.factory-item .build-btn:disabled{background:#4a6080;cursor:not-allowed}

.mineral-info{background:var(--bgp);border-radius:4px;padding:4px 8px;border:1px solid var(--bd);margin-bottom:3px;font-size:.55rem}
.mineral-info .m-battle{color:#e74c3c;cursor:pointer}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);display:none;justify-content:center;align-items:center;z-index:1000}
.modal-overlay.show{display:flex}
.modal-box{background:var(--bgb);border-radius:14px;padding:20px 24px;max-width:580px;width:92%;border:1px solid var(--bl);max-height:85vh;overflow-y:auto}
.modal-box h2{color:var(--th);font-size:1rem;margin-bottom:10px;border-bottom:1px solid var(--bd);padding-bottom:6px}
.modal-box .content{color:#9bb3d9;font-size:.8rem;line-height:1.5}
.modal-box .item{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #0f182a;font-size:.7rem}
.modal-box .close-btn{margin-top:14px;background:#2a5a7a;border:none;border-radius:30px;padding:6px 20px;color:#fff;font-weight:600;cursor:pointer;width:100%;font-size:.8rem}
.modal-box .ship-card{background:var(--bgp);border-radius:5px;padding:6px 10px;border:1px solid var(--bd);margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.modal-box .ship-card .btn-mini{font-size:.45rem;padding:1px 8px;border-radius:20px;border:none;cursor:pointer;color:#fff;height:18px}
.modal-box .ship-card .btn-mini.deploy{background:#1f6a3a}
.modal-box .ship-card .btn-mini.undeploy{background:#6a2a2a}
.modal-box .ship-card .btn-mini.detail{background:#2a5a7a}

.alliance-list{display:flex;flex-direction:column;gap:4px;padding:4px 0}
.alliance-item{background:var(--bgp);border:1px solid var(--bd);border-radius:6px;padding:8px 12px;cursor:pointer;transition:.1s}
.alliance-item:hover{border-color:var(--gold);background:rgba(212,168,67,.05)}
.alliance-item .a-name{font-size:.75rem;color:var(--gold);font-weight:600}
.alliance-item .a-info{font-size:.55rem;color:var(--ts);margin-top:2px}
.member-row{display:flex;justify-content:space-between;align-items:center;padding:5px 8px;border-bottom:1px solid var(--bd);font-size:.6rem}
.member-row .m-action{padding:1px 8px;font-size:.45rem;border-radius:20px;border:none;cursor:pointer;background:#6a2a2a;color:#fff}
.task-row{display:flex;justify-content:space-between;align-items:center;padding:4px 8px;border-bottom:1px solid var(--bd);font-size:.55rem}
.task-row .t-reward{color:var(--gold)}
.task-row .t-btn{padding:1px 8px;font-size:.45rem;border-radius:20px;border:none;cursor:pointer;background:var(--grn);color:#fff}
.task-row .t-btn:disabled{background:#4a6080;cursor:not-allowed}

@media(max-width:1024px){.left-panel{width:200px}.right-panel{width:240px}}
@media(max-width:768px){.left-panel,.right-panel{display:none}.friendly-column,.enemy-column{width:100px}}
</style>
</head>
<body>
<button id="themeToggle">🌙</button>

<div class="login-overlay" id="loginOverlay">
<div class="login-box">
<h1>星际征途</h1>
<div class="sub" id="loginSub">登录你的星际账号</div>
<div id="loginFields">
<div class="field"><label>账号</label><input type="text" id="loginUsername" placeholder="请输入账号..." maxlength="16"></div>
<div class="field"><label>密码</label><input type="password" id="loginPassword" placeholder="请输入密码..." maxlength="20"></div>
<button class="login-btn" id="loginBtn">登 录</button>
<div class="error" id="loginError"></div>
<div class="success" id="loginSuccess"></div>
<div class="toggle-mode" id="toggleMode">没有账号？ <span>立即注册</span></div>
</div>
<div id="registerFields" style="display:none;">
<div class="field"><label>账号</label><input type="text" id="registerUsername" placeholder="请输入账号..." maxlength="16"></div>
<div class="field"><label>密码</label><input type="password" id="registerPassword" placeholder="请输入密码..." maxlength="20"></div>
<div class="field"><label>确认密码</label><input type="password" id="registerConfirm" placeholder="再次输入密码..." maxlength="20"></div>
<button class="login-btn" id="registerBtn">注 册</button>
<div class="error" id="registerError"></div>
<div class="success" id="registerSuccess"></div>
<div class="toggle-mode" id="toggleModeBack">已有账号？ <span>去登录</span></div>
</div>
</div>
</div>

<div id="app" style="display:none;">
<div class="top-bar">
<div class="user-info">

async function saveToGist(data){
  const url=`https://api.github.com/gists/${GIST_ID}`;
  let sha='';
  try{const r=await fetch(url);if(r.ok){const i=await r.json();sha=i.files[GIST_FILENAME]?.sha||''}}catch(e){}
  const payload={files:{[GIST_FILENAME]:{content:JSON.stringify(data,null,2)}}};
  if(sha)payload.sha=sha;
  const r=await fetch(url,{method:'PATCH',headers:{'Authorization':`token ${GITHUB_TOKEN}`,'Content-Type':'application/json'},body:JSON.stringify(payload)});
  return r.ok;
}
async function loadFromGist(){
  try{const r=await fetch(`https://api.github.com/gists/${GIST_ID}`);if(!r.ok)return null;const i=await r.json();const c=i.files[GIST_FILENAME]?.content;if(!c)return{};return JSON.parse(c)}catch(e){return null}
}

function getPlayerData(){return{inventory,tradeList,credits,playerShips,statBattles,statWins,statLosses,statDrops,playerLevel,playerExp,maxExp,currentGalaxyIdx,currentSystemIdx,blueprints,constructionQueue,maxShips,upgradeLevel,alphaSquadDefeated,redeemedCodes,currentAlliance,lastOnline:now(),lastTaskRefresh}}

async function saveGameImmediate(){
  if(!currentUser)return false;
  if(_saveInProgress){await new Promise(r=>setTimeout(r,100));return saveGameImmediate()}
  _saveInProgress=true;
  updateSyncStatus('syncing','保存中...');
  try{
    let allData=await loadFromGist()||{};
    if(!allData.players)allData.players={};
    if(!allData.alliances)allData.alliances={};
    if(!allData.meta)allData.meta={};
    allData.players[currentUser]=getPlayerData();
    allData.alliances=allianceData;
    allData.meta.lastUpdate=now();
    // 计算排行榜
    allData.leaderboard=Object.keys(allData.players).map(name=>{const p=allData.players[name];let power=100;(p.playerShips||[]).forEach(s=>{power+=Math.floor(s.maxHp/2)+s.atk*3});return{name,power,level:p.playerLevel||1}}).sort((a,b)=>b.power-a.power);
    const ok=await saveToGist(allData);
    updateSyncStatus(ok?'ok':'fail',ok?'已同步':'保存失败');
    return ok;
  }catch(e){updateSyncStatus('fail','保存异常');return false}
  finally{_saveInProgress=false}
}

async function loadFromServer(){
  if(!currentUser)return null;
  try{
    const allData=await loadFromGist();
    if(!allData)return null;
    allianceData=allData.alliances||{};
    if(allData.players&&allData.players[currentUser])return allData.players[currentUser];
    return null;
  }catch(e){return null}
}

async function consumeItems(items,actionFn){
  const backup=JSON.parse(JSON.stringify(inventory));
  for(const[name,qty]of Object.entries(items)){if(!inventory[name]||inventory[name].count<qty)return{success:false,error:'材料不足：'+name}}
  for(const[name,qty]of Object.entries(items)){inventory[name].count-=qty;if(inventory[name].count<=0)delete inventory[name]}
  try{const r=await actionFn();if(r===false){inventory=backup;return{success:false,error:'操作失败'}}return{success:true}}
  catch(e){inventory=backup;return{success:false,error:e.message}}
}

function updateSyncStatus(s,msg){const el=document.getElementById('syncStatus');if(!el)return;el.className='';if(s==='ok'){el.textContent='● '+(msg||'已同步');el.classList.add('ok')}else if(s==='syncing'){el.textContent='⟳ '+(msg||'同步中...');el.classList.add('sync')}else{el.textContent='✗ '+(msg||'同步失败');el.classList.add('fail')}}

async function doRegister(){
  const u=document.getElementById('registerUsername').value.trim(),p=document.getElementById('registerPassword').value.trim(),c=document.getElementById('registerConfirm').value.trim();
  const errEl=document.getElementById('registerError'),okEl=document.getElementById('registerSuccess');
  if(!u||!p||!c){errEl.textContent='请填写完整信息';return}
  if(u.length<2){errEl.textContent='账号至少2个字符';return}
  if(p.length<3){errEl.textContent='密码至少3个字符';return}
  if(p!==c){errEl.textContent='两次密码不一致';return}
  const users=getUsers();
  if(users[u]){errEl.textContent='账号已存在';return}
  inventory=createInitialInventory();tradeList=[];credits=0;playerShips=createInitialShips();blueprints=[];constructionQueue=[];
  maxShips={front:2,mid:1,rear:2};upgradeLevel={front:0,mid:0,rear:0};
  statBattles=0;statWins=0;statLosses=0;statDrops=0;playerLevel=1;playerExp=0;maxExp=100;
  currentGalaxyIdx=0;currentSystemIdx=0;alphaSquadDefeated={};redeemedCodes={};currentAlliance=null;lastTaskRefresh=getToday();
  users[u]=p;saveUsers(users);
  const tempUser=currentUser;currentUser=u;
  const saved=await saveGameImmediate();
  if(saved){errEl.textContent='';okEl.textContent='注册成功！正在登录...';currentUser=tempUser;document.getElementById('loginUsername').value=u;document.getElementById('loginPassword').value=p;setTimeout(()=>{showLogin();doLogin()},500)}
  else{errEl.textContent='注册失败，请检查网络';currentUser=tempUser}
}

async function doLogin(){
  const u=document.getElementById('loginUsername').value.trim(),p=document.getElementById('loginPassword').value.trim();
  const errEl=document.getElementById('loginError'),okEl=document.getElementById('loginSuccess');
  if(!u||!p){errEl.textContent='请输入账号和密码';return}
  const users=getUsers();
  if(!users[u]){errEl.textContent='账号不存在，请先注册';return}
  if(users[u]!==p){errEl.textContent='密码错误';return}
  errEl.textContent='';okEl.textContent='登录成功！';
  currentUser=u;document.getElementById('playerName').textContent=u;
  document.getElementById('loginOverlay').classList.add('hidden');
  document.getElementById('app').style.display='flex';
  const loaded=await loadFromServer();
  if(loaded&&Object.keys(loaded).length>0){
    Object.assign(window,loaded);
    if(!Array.isArray(playerShips)||playerShips.length===0)playerShips=createInitialShips();
    if(!Array.isArray(blueprints))blueprints=[];
    if(!Array.isArray(constructionQueue))constructionQueue=[];
    if(!currentAlliance)currentAlliance=null;
    addLog('☁️ 从 Gist 加载数据成功','sys');
  }else{
    inventory=createInitialInventory();playerShips=createInitialShips();credits=0;lastTaskRefresh=getToday();
    await saveGameImmediate();
    addLog('🆕 新玩家已初始化','sys');
  }
  checkDailyTaskRefresh();
  renderAll();
  updateSyncStatus('ok');
}

function renderGalaxies(){
  const c=document.getElementById('galaxyContainer');if(!c)return;c.innerHTML='';
  GALAXY_DATA.forEach((g,idx)=>{
    const isActive=idx===currentGalaxyIdx;
    const isExpanded=galaxyExpanded[idx]!==undefined?galaxyExpanded[idx]:(idx===0);
    const group=document.createElement('div');group.className='galaxy-group';
    const header=document.createElement('div');header.className='galaxy-header';
    header.style.borderColor=isActive?'#d4a843':'';
    header.innerHTML=`<span>${g.name} <span class="g-tier">T${g.tier}</span></span><span class="g-arrow ${isExpanded?'open':''}">▶</span>`;
    header.addEventListener('click',()=>{galaxyExpanded[idx]=!galaxyExpanded[idx];renderGalaxies()});
    const sysDiv=document.createElement('div');sysDiv.className='galaxy-systems'+(isExpanded?' open':'');
    g.systems.forEach((sn,si)=>{
      const isA=idx===currentGalaxyIdx&&si===currentSystemIdx;
      const mn=g.levelBase+si*2,mx=mn+3;
      const chip=document.createElement('span');chip.className='system-chip'+(isA?' active':'');
      chip.innerHTML=`${sn} <span class="s-lvl">(${mn}-${mx})</span>`;
      chip.addEventListener('click',e=>{e.stopPropagation();currentGalaxyIdx=idx;currentSystemIdx=si;galaxyExpanded[idx]=true;renderGalaxies();updateBattleInfo();generateEnemies();saveGameImmediate();addLog('🪐 进入 '+sn,'sys')});
      sysDiv.appendChild(chip);
    });
    group.appendChild(header);group.appendChild(sysDiv);c.appendChild(group);
  });
}
function getCurrentGalaxy(){return GALAXY_DATA[currentGalaxyIdx]||GALAXY_DATA[0]}
function getCurrentSystemName(){const g=getCurrentGalaxy();return g.systems[currentSystemIdx]||g.systems[0]}
function getSystemLevel(){const g=getCurrentGalaxy();const b=g.levelBase||1;return{min:b+currentSystemIdx*2,max:b+currentSystemIdx*2+3}}
function getGalaxyTier(){return getCurrentGalaxy().tier||1}

function generateEnemies(){
  const lv=getSystemLevel(),tier=Math.min(getGalaxyTier(),7);
  const db=SHIP_DB['T'+tier];if(!db)return;
  const all=[...db.front,...db.mid,...db.rear];
  let count=5;if(currentGalaxyIdx>=4&&Math.random()<.7)count=8+Math.floor(Math.random()*5);
  enemies=[];
  for(let i=0;i<count;i++){
    const name=all[Math.floor(Math.random()*all.length)];
    const baseLv=lv.min+Math.floor(Math.random()*(lv.max-lv.min+1));
    const pos=['front','mid','rear'][Math.floor(Math.random()*3)];
    const base=getBaseStats(tier,pos);
    const hp=applyDeviation(base.hp,tier),atk=applyDeviation(base.atk,tier);
    const affixes=[];
    // 20%概率获得1个词条
    if(Math.random()<0.2)affixes.push(randomAffix());
    enemies.push({id:'e'+i+'_'+Date.now(),name:name+' Lv.'+baseLv,hp,maxHp:hp,atk,alive:true,reward:5+baseLv*2+Math.floor(Math.random()*5),tier,level:baseLv,pos,affixes});
  }
  renderEnemy();updateBattleInfo();
}

function renderEnemy(){
  const col=document.getElementById('enemyColumn');col.innerHTML='';
  const alive=enemies.filter(e=>e.alive);
  if(alive.length===0){generateEnemies();return}
  alive.forEach(enemy=>{
    const div=document.createElement('div');div.className='enemy-unit';
    const pct=Math.round((enemy.hp/enemy.maxHp)*100);
    let at=enemy.affixes?.map(a=>`<span style="font-size:.3rem;color:#9b59b6;">[${a.name}]</span>`).join('')||'';
    div.innerHTML=`<div class="ship-info"><div class="ship-name">◈ ${enemy.name} ${at}</div><div class="hp-wrap"><span class="hp-text">${Math.floor(enemy.hp)}/${enemy.maxHp}</span><div class="hp-bar"><div class="fill" style="width:${pct}%;"></div></div></div></div><span class="ship-icon">◈</span>`;
    col.appendChild(div);
  });
  document.getElementById('enemyCount').textContent=alive.length;
}

function updateFleetUI(){

  document.getElementById('fleetCountLabel').textContent=dep.length+'/'+(maxShips.front+maxShips.mid+maxShips.rear);
  friendlyShips=dep.map(s=>({...s,hp:s.hp,maxHp:s.maxHp,atk:s.atk,charge:s.charge||0,maxCharge:100,heal:s.pos==='rear'?12:0,burst:s.affixes.some(a=>a.id==='burst'),dmgBonus:s.affixes.reduce((sum,a)=>sum+(a.id==='focus'?a.value/100:0),0),plunder:s.affixes.reduce((sum,a)=>sum+(a.id==='plunder'?a.value/100:0),0),selfDestruct:s.affixes.reduce((sum,a)=>sum+(a.id==='self_destruct'?a.value/100:0),0),isAlive:true}));
  renderFleet();updatePower();
}

function renderFleet(){
  const col=document.getElementById('friendlyColumn');col.innerHTML='';
  if(!friendlyShips||friendlyShips.length===0){col.innerHTML='<div style="color:#4a6080;font-size:.5rem;text-align:center;">暂无战舰</div>';return}
  const order=['rear','mid','front'];
  [...friendlyShips].sort((a,b)=>order.indexOf(a.pos)-order.indexOf(b.pos)).forEach(ship=>{
    const div=document.createElement('div');div.className='friendly-unit';
    const color=getQualityColor(ship.tier);div.style.borderColor=color;
    const pct=Math.round((ship.hp/ship.maxHp)*100);
    let extra='';
    if(ship.pos==='mid'){const cp=Math.round((ship.charge||0)/100*100);extra=`<div class="charge-bar"><div class="fill" style="width:${cp}%;"></div></div>`}
    const at=ship.affixes?.map(a=>`<span style="font-size:.3rem;color:#9b59b6;">[${a.name}]</span>`).join('')||'';
    div.innerHTML=`<span class="pos-tag ${ship.pos}">${ship.pos==='front'?'先锋':ship.pos==='mid'?'中间':'后勤'}</span><div class="ship-info"><div class="ship-name" style="color:${color};">${ship.name} ${at}</div><div class="hp-wrap"><div class="hp-bar"><div class="fill" style="width:${pct}%;"></div></div><span class="hp-text">${Math.floor(ship.hp)}/${ship.maxHp}</span></div>${extra}</div>`;
    div.addEventListener('click',()=>showShipDetail(ship.id));

}

function updateBattleInfo(){
  const g=getCurrentGalaxy(),lv=getSystemLevel();
  document.getElementById('battleLocation').textContent=g.name+' · '+getCurrentSystemName();
  document.getElementById('enemyInfo').textContent='敌人等级: '+lv.min+'-'+lv.max;

function updatePower(){
  let t=100;
  playerShips.forEach(s=>{t+=Math.floor(s.maxHp/2)+s.atk*3;if(s.affixes)s.affixes.forEach(a=>{if(a.id==='heavy_armor')t+=Math.floor(s.maxHp*.05);if(a.id==='focus')t+=Math.floor(s.atk*.1)})});
  document.getElementById('powerDisplay').textContent=Math.floor(t);
}

function syncFleetHpToPlayer(){if(!friendlyShips||!playerShips)return;friendlyShips.forEach(fs=>{const ps=playerShips.find(s=>s.id===fs.id);if(ps){ps.hp=fs.hp;ps.maxHp=fs.maxHp;ps.atk=fs.atk;ps.charge=fs.charge||0}})}

function handleEnemyDeath(target,ship){
  const reward=target.reward||10;credits+=reward;document.getElementById('creditDisplay').textContent=credits;
  addLog(`💰 击杀 ${target.name} 获得 ${reward} 星际币`,'loot');
  const expGain=Math.floor((target.level||1)*.8);addExp(expGain);
  if(ship.plunder){const h=Math.floor(ship.maxHp*ship.plunder);ship.hp=Math.min(ship.maxHp,ship.hp+h)}
  const dropRate=.08+(currentGalaxyIdx*.02);
  if(Math.random()<dropRate){const dt=Math.min(target.tier||1,7);const pool=ALL_MATERIALS.filter(m=>m.tier===dt);if(pool.length){const mat=pool[Math.floor(Math.random()*pool.length)];const qty=1+Math.floor(Math.random()*(1+Math.floor(currentGalaxyIdx/3)));if(inventory[mat.name])inventory[mat.name].count+=qty;else inventory[mat.name]={count:qty,tier:mat.tier};statDrops++;addLog(`🎁 掉落 ${mat.name} x${qty}`,'loot');renderWarehouse()}}
  if(Math.random()<.01){addBlueprint(getGalaxyTier());renderWarehouse()}
  saveGameImmediate();
}

function addExp(a){playerExp+=a;while(playerExp>=maxExp){playerExp-=maxExp;playerLevel++;maxExp=Math.floor(maxExp*1.3)+50;addLog('🎉 升级！Lv.'+playerLevel,'exp')}document.getElementById('levelDisplay').textContent='Lv.'+playerLevel}

function handleDefeat(){
  if(isDefeated)return;isDefeated=true;isAuto=false;
  document.getElementById('statusLabel').textContent='💀 战败·暂停5秒';
  document.getElementById('statusLabel').style.color='#c0392b';
  document.getElementById('btnAutoBattle').textContent='⏳ 等待...';
  addLog('💀 战败，5秒后修复','dmg');enemies=[];renderEnemy();
  if(defeatTimer)clearTimeout(defeatTimer);
  defeatTimer=setTimeout(()=>{
    isDefeated=false;
    playerShips.forEach(s=>{s.hp=s.maxHp;s.charge=0});
    friendlyShips.forEach(fs=>{fs.hp=fs.maxHp;fs.charge=0});
    syncFleetHpToPlayer();
    addLog('🔧 修复完成','heal');
    document.getElementById('statusLabel').textContent='⚔️ 战斗中';
    document.getElementById('statusLabel').style.color='';
    isAuto=true;document.getElementById('btnAutoBattle').textContent='⏸️ 暂停';
    generateEnemies();renderFleet();defeatTimer=null;
  },5000);
}

function doBattle(){
  if(!isAuto||isDefeated||isPaused)return;
  enemies=enemies.filter(e=>e.alive||e.hp>0);enemies.forEach(e=>{if(e.hp<=0)e.alive=false});
  if(friendlyShips.filter(s=>s.hp>0).length===0){statLosses++;statBattles++;handleDefeat();return}
  const alive=enemies.filter(e=>e.alive);
  if(alive.length===0){statWins++;statBattles++;addLog('🎉 战斗胜利！','loot');isAuto=false;document.getElementById('btnAutoBattle').textContent='▶️ 继续';document.getElementById('statusLabel').textContent='⏸️ 已暂停(胜利)';syncFleetHpToPlayer();saveGameImmediate();return}
  const order=['front','mid','rear'];
  const sorted=[...friendlyShips].filter(s=>s.hp>0).sort((a,b)=>order.indexOf(a.pos)-order.indexOf(b.pos));
  for(const ship of sorted){
    const tg=enemies.filter(e=>e.alive);if(tg.length===0)break;
    const target=tg[Math.floor(Math.random()*tg.length)];
    let bd=ship.atk+Math.floor(Math.random()*5)-2;
    if(ship.pos==='mid'){ship.charge=Math.min(100,(ship.charge||0)+25+Math.floor(Math.random()*15));bd=Math.floor(bd*(1+ship.charge/100));if(ship.charge>=100){addLog(`💥 满蓄力！对 ${target.name} 造成 ${bd} 伤害`,'dmg');ship.charge=0}else addLog(`💥 蓄力 ${Math.round(ship.charge)}% 对 ${target.name} 造成 ${bd} 伤害`,'dmg')}else{addLog(`⚔️ ${ship.name} 对 ${target.name} 造成 ${bd} 伤害`,'dmg')}
    let dmg=bd;if(ship.dmgBonus)dmg=Math.floor(dmg*(1+ship.dmgBonus));
    if(ship.burst){target.hp-=dmg;if(target.hp<=0){target.alive=false;handleEnemyDeath(target,ship)}if(target.alive){const d2=Math.floor(dmg*.8);target.hp-=d2;if(target.hp<=0){target.alive=false;handleEnemyDeath(target,ship)}addLog(`🔁 连发 ${target.name} ${d2} 伤害`,'dmg')}}else{target.hp-=dmg;if(target.hp<=0){target.alive=false;handleEnemyDeath(target,ship)}}
  }
  const aliveShips=friendlyShips.filter(s=>s.hp>0);
  for(const enemy of enemies.filter(e=>e.alive)){
    if(aliveShips.length===0)break;
    let target=null;
    for(const pos of ['front','mid','rear']){const c=aliveShips.filter(s=>s.pos===pos);if(c.length>0){target=c[Math.floor(Math.random()*c.length)];break}}
    if(!target)target=aliveShips[Math.floor(Math.random()*aliveShips.length)];
    let dmg=Math.max(1,enemy.atk+Math.floor(Math.random()*4)-2);
    if(enemy.affixes)enemy.affixes.forEach(a=>{if(a.id==='focus')dmg=Math.floor(dmg*(1+a.value/100))});
    target.hp-=dmg;if(target.hp<0)target.hp=0;
    addLog(`👾 ${enemy.name} 攻击 ${target.name} 造成 ${dmg} 伤害`,'dmg');
    if(target.hp<=0&&target.selfDestruct){const ex=Math.floor(target.maxHp*target.selfDestruct);enemies.forEach(e=>{if(e.alive){e.hp-=ex;if(e.hp<=0)e.alive=false}});addLog(`💥 ${target.name} 自爆！${ex} 伤害`,'dmg')}
  }
  for(const ship of friendlyShips.filter(s=>s.pos==='rear'&&s.hp>0)){
    const dam=friendlyShips.filter(s=>s.hp>0&&s.hp<s.maxHp);
    if(dam.length>0){const t=dam.sort((a,b)=>(a.hp/a.maxHp)-(b.hp/b.maxHp))[0];const h=8+Math.floor(Math.random()*8);t.hp=Math.min(t.maxHp,t.hp+h);addLog(`💚 ${ship.name} 修复 ${t.name} +${h}`,'heal')}
  }
  enemies=enemies.filter(e=>e.alive);
  if(friendlyShips.filter(s=>s.hp>0).length===0){statLosses++;statBattles++;handleDefeat()}
  syncFleetHpToPlayer();renderFleet();renderEnemy();saveGameImmediate();
}

function updateSellSelect(){const s=document.getElementById('sellSelectPage');const slots=Object.keys(inventory);if(slots.length===0){s.innerHTML='<option value="">仓库为空</option>';return}s.innerHTML=slots.map(n=>`<option value="${n}">${n} x${inventory[n].count} (T${inventory[n].tier})</option>`).join('')}

function renderFactory(){
  const fl=document.getElementById('factoryList');if(!fl)return;fl.innerHTML='';
  const learned=blueprints.filter(b=>b.learned&&!b.used);
  const building=constructionQueue.filter(c=>!c.completed);
  if(building.length){
    let html='<div style="color:#d4a843;font-size:.6rem;margin-bottom:4px;">🔧 建造中</div><div class="factory-grid">';
    building.forEach(c=>{
      const totalMs=getBuildTime(c.tier);const elapsed=now()-c.startTime;
      const pct=Math.min(100,Math.floor((elapsed/totalMs)*100));
      const color=getQualityColor(c.tier);const remain=Math.max(0,Math.ceil((totalMs-elapsed)/1000));
      html+=`<div class="factory-item" style="border-color:${color};"><div class="fname" style="color:${color};">${c.name}</div><div class="ftier">T${c.tier} · ${c.pos}</div><div class="fprogress"><div class="fill" style="width:${pct}%;"></div></div><div style="font-size:.5rem;color:#d4a843;">⏳ ${remain}s (${pct}%)</div></div>`;
    });
    html+='</div>';fl.innerHTML+=html;
  }
  if(learned.length===0&&building.length===0){fl.innerHTML='<div style="color:#4a6080;font-size:.6rem;text-align:center;padding:20px 0;">暂无可建造蓝图<br>打怪获得蓝图后在仓库学习</div>';return}
  if(learned.length){
    let html='<div style="color:#4aad7a;font-size:.6rem;margin:4px 0;">📐 可建造</div><div class="factory-grid">';
    learned.forEach(bp=>{
      const color=getQualityColor(bp.tier);const recipe=getShipRecipe(bp.name);
      let canBuild=false;
      if(recipe){canBuild=true;for(const[mat,qty]of Object.entries(recipe)){if(!inventory[mat]||inventory[mat].count<qty){canBuild=false;break}}}
      const rs=recipe?Object.entries(recipe).map(([k,v])=>`${k}x${v}`).join(' '):'无配方';
      html+=`<div class="factory-item ${canBuild?'':'dim'}" style="border-color:${color};"><div class="fname" style="color:${color};">${bp.name}</div><div class="ftier">T${bp.tier} · ${bp.pos}</div><div style="font-size:.4rem;color:#4a6080;margin:2px 0;">${rs}</div><div style="font-size:.45rem;color:${canBuild?'#4aad7a':'#4a6080'};">${canBuild?'✅ 材料充足':'⚠️ 材料不足'}</div><button class="build-btn" ${canBuild?`onclick="startBuilding('${bp.id}')"`:'disabled'}>🔧 建造</button></div>`;
    });
    html+='</div>';fl.innerHTML+=html;
  }
}

window.startBuilding=async function(bpId){
  const bp=blueprints.find(b=>b.id===bpId);if(!bp||!bp.learned||bp.used)return;
  const recipe=getShipRecipe(bp.name);if(!recipe){addLog('❌ 无配方','dmg');return}
  const result=await consumeItems(recipe,async()=>{bp.used=true;constructionQueue.push({id:'c_'+Date.now(),name:bp.name,tier:bp.tier,pos:bp.pos,startTime:now(),completed:false});return true});
  if(result.success){addLog('🔧 开始建造 '+bp.name+'，预计'+(bp.tier*30)+'秒','sys');renderWarehouse();renderFactory();await saveGameImmediate()}
  else addLog('❌ '+result.error,'dmg');
};

setInterval(()=>{
  let ch=false;
  constructionQueue.forEach(c=>{
    if(!c.completed){
      const el=now()-c.startTime;
      if(el>=getBuildTime(c.tier)){
        c.completed=true;
        const ns=createShip(c.name,c.pos,c.tier,false);
        playerShips.push(ns);
        addLog('✅ 战舰建造完成！'+c.name+' (T'+c.tier+')','loot');
        ch=true;updateFleetUI();renderWarehouse();saveGameImmediate();
      }
    }
  });
  constructionQueue=constructionQueue.filter(c=>!c.completed||(now()-c.startTime<getBuildTime(c.tier)+30000));

},2000);

window.quickSell=function(name){
  if(!inventory[name]||inventory[name].count<=0)return;
  const price=10+inventory[name].tier*20+Math.floor(Math.random()*30);
  inventory[name].count-=1;if(inventory[name].count<=0)delete inventory[name];
  tradeList.push({name,price,qty:1,tier:inventory[name]?.tier||1,seller:currentUser,time:now()});
  addLog(`📤 上架 ${name} x1 单价 ${price}`,'loot');
  renderWarehouse();renderMarket();renderMyOrders();saveGameImmediate();
};
window.dropItem=function(name){if(!inventory[name])return;if(inventory[name].count<=1)delete inventory[name];else inventory[name].count--;addLog('🗑️ 丢弃了 '+name,'dmg');renderWarehouse();saveGameImmediate()};
window.confirmSellPage=function(){
  const n=document.getElementById('sellSelectPage').value,p=parseInt(document.getElementById('sellPricePage').value)||50,q=parseInt(document.getElementById('sellQtyPage').value)||1;
  if(!n||!inventory[n]){addLog('❌ 物品不存在','dmg');return}
  if(inventory[n].count<q){addLog('❌ 数量不足','dmg');return}
  inventory[n].count-=q;if(inventory[n].count<=0)delete inventory[n];
  tradeList.push({name:n,price:p,qty:q,tier:inventory[n]?.tier||1,seller:currentUser,time:now()});
  addLog(`📤 上架 ${n} x${q} 单价 ${p}`,'loot');
  renderWarehouse();renderMarket();renderMyOrders();saveGameImmediate();
};
window.delistItem=function(i){
  if(i<0||i>=tradeList.length)return;const it=tradeList[i];
  if(it.seller!==currentUser){addLog('❌ 只能下架自己的','dmg');return}
  const q=it.qty;
  if(inventory[it.name])inventory[it.name].count+=q;else inventory[it.name]={count:q,tier:it.tier};
  tradeList.splice(i,1);addLog(`📥 下架 ${it.name} x${q}`,'sys');
  renderWarehouse();renderMarket();renderMyOrders();saveGameImmediate();
};
window.buyItem=async function(i){
  if(i<0||i>=tradeList.length)return;const it=tradeList[i];
  if(it.seller===currentUser){addLog('❌ 不能购买自己的','dmg');return}
  const q=prompt('购买数量（最多'+it.qty+'）','1');if(!q)return;
  const num=parseInt(q);if(isNaN(num)||num<=0)return;
  if(num>it.qty){addLog('❌ 库存不足','dmg');return}
  const tp=it.price*num;
  if(credits<tp){addLog('❌ 星际币不足，需要 '+tp,'dmg');return}
  credits-=tp;document.getElementById('creditDisplay').textContent=credits;
  it.qty-=num;
  if(inventory[it.name])inventory[it.name].count+=num;else inventory[it.name]={count:num,tier:it.tier};
  // 给卖家加钱
  try{const ad=await loadFromGist()||{};if(ad.players&&ad.players[it.seller]){ad.players[it.seller].credits=(ad.players[it.seller].credits||0)+tp;await saveToGist(ad);addLog(`💰 转账 ${tp} 星际币给 ${it.seller}`,'sys')}}catch(e){}
  addLog(`🛒 购买 ${it.name} x${num}，花费 ${tp}`,'loot');
  if(it.qty<=0)tradeList.splice(i,1);
  renderWarehouse();renderMarket();renderMyOrders();saveGameImmediate();
};

function renderMarket(){
  const s=document.getElementById('tradeSearchInput')?.value?.toLowerCase()||'';
  const tf=document.getElementById('tradeTierFilter')?.value||'all';
  const filtered=tradeList.filter(it=>{if(it.seller===currentUser)return false;if(s&&!it.name.toLowerCase().includes(s))return false;if(tf!=='all'&&it.tier!==parseInt(tf))return false;return it.qty>0});
  const tp=Math.max(1,Math.ceil(filtered.length/PAGE_SIZE));if(marketPage>tp)marketPage=tp;
  const st=(marketPage-1)*PAGE_SIZE;const pi=filtered.slice(st,st+PAGE_SIZE);
  const list=document.getElementById('marketList');list.innerHTML='';
  if(pi.length===0)list.innerHTML='<div class="trade-empty-page">📭 暂无上架物品</div>';
  else pi.forEach(it=>{
    const ri=tradeList.indexOf(it);const div=document.createElement('div');div.className='trade-item-page';
    div.innerHTML=`<div class="info"><span class="name" style="color:${getQualityColor(it.tier)};">${it.name}</span><span style="font-size:.4rem;color:#4a6080;">T${it.tier} 👤${it.seller} ×${it.qty}</span></div><div><span style="color:#d4a843;font-weight:600;">${it.price}💰</span> <button class="btn-page" onclick="buyItem(${ri})">购买</button></div>`;
    list.appendChild(div);
  });
  renderPagination('marketPagination',marketPage,tp,p=>{marketPage=p;renderMarket()});
}
function renderMyOrders(){
  const my=tradeList.filter(it=>it.seller===currentUser);
  const tp=Math.max(1,Math.ceil(my.length/PAGE_SIZE));if(myOrdersPage>tp)myOrdersPage=tp;
  const st=(myOrdersPage-1)*PAGE_SIZE;const pi=my.slice(st,st+PAGE_SIZE);
  const list=document.getElementById('myOrdersList');list.innerHTML='';
  if(pi.length===0)list.innerHTML='<div class="trade-empty-page">📭 你还没有上架物品</div>';
  else pi.forEach(it=>{
    const ri=tradeList.indexOf(it);const div=document.createElement('div');div.className='trade-item-page';
    div.innerHTML=`<div class="info"><span class="name" style="color:${getQualityColor(it.tier)};">${it.name}</span><span style="font-size:.4rem;color:#4a6080;">T${it.tier} ×${it.qty} 💰${it.price}</span></div><div><button class="btn-page delist" onclick="delistItem(${ri})">下架</button></div>`;
    list.appendChild(div);
  });
  renderPagination('myOrdersPagination',myOrdersPage,tp,p=>{myOrdersPage=p;renderMyOrders()});
}
function renderPagination(id,cur,tot,cb){
  const c=document.getElementById(id);if(!c)return;c.innerHTML='';if(tot<=1)return;
  const p=document.createElement('button');p.textContent='‹';p.onclick=()=>{if(cur>1)cb(cur-1)};c.appendChild(p);
  const i=document.createElement('span');i.style.cssText='font-size:.45rem;color:#4a6080;padding:1px 6px;';i.textContent=cur+'/'+tot;c.appendChild(i);
  const n=document.createElement('button');n.textContent='›';n.onclick=()=>{if(cur<tot)cb(cur+1)};c.appendChild(n);
}

function checkMineralSpawn(){
  GALAXY_DATA.forEach((g,idx)=>{
    if(Math.random()<.5){
      const sn=g.systems[Math.floor(Math.random()*g.systems.length)];
      mineralPlanets.push({id:'min_'+Date.now()+'_'+idx,galaxyIdx:idx,galaxyName:g.name,systemName:sn,tier:g.tier,miner:null,startTime:now(),expireTime:now()+3600000,active:true});
      addLog('💎 矿物星球出现在 '+g.name+' · '+sn,'loot');
    }

function renderMineralStatus(){
  const n=now();mineralPlanets=mineralPlanets.filter(p=>p.active&&p.expireTime>n);
  const ms=document.getElementById('mineralStatus');ms.innerHTML='';
  if(mineralPlanets.length===0){ms.innerHTML='<div style="color:#4a6080;font-size:.55rem;text-align:center;padding:20px 0;">暂无矿物星球</div>';return}
  mineralPlanets.forEach(p=>{
    const r=Math.max(0,Math.floor((p.expireTime-n)/60000));const div=document.createElement('div');div.className='mineral-info';
    const isM=p.miner===currentUser;const cB=p.miner&&p.miner!==currentUser;
    div.innerHTML=`<div style="color:${getQualityColor(p.tier)};font-weight:600;">💎 ${p.galaxyName} · ${p.systemName} (T${p.tier})</div><div style="font-size:.5rem;color:#6f8bb0;">⏱️ 剩余 ${r} 分钟 | ${p.miner?'👤 '+p.miner:'⏸️ 无人'}</div>${isM?'<div style="color:#4aad7a;font-size:.5rem;">✅ 开采中</div>':cB?`<div class="m-battle" onclick="challengeMiner('${p.id}')">⚔️ 挑战</div>`:`<div class="m-battle" onclick="startMining('${p.id}')">⛏️ 开始开采</div>`}`;
    ms.appendChild(div);
  });
}
window.startMining=function(pid){
  const p=mineralPlanets.find(x=>x.id===pid);if(!p||p.miner)return;
  p.miner=currentUser;addLog('⛏️ 开始开采','loot');renderMineralStatus();

    const pl=mineralPlanets.find(x=>x.id===pid);if(!pl||pl.miner!==currentUser)return;
    if(Math.random()<.8){const pool=ALL_MATERIALS.filter(m=>m.tier===pl.tier);if(pool.length){const mat=pool[Math.floor(Math.random()*pool.length)];const q=1+Math.floor(Math.random()*2);if(inventory[mat.name])inventory[mat.name].count+=q;else inventory[mat.name]={count:q,tier:mat.tier};addLog(`⛏️ 开采到 ${mat.name} x${q}`,'loot');renderWarehouse();saveGameImmediate()}}
  },60000);
};
window.challengeMiner=function(pid){
  const p=mineralPlanets.find(x=>x.id===pid);if(!p||!p.miner)return;
  const my=parseInt(document.getElementById('powerDisplay').textContent),def=Math.floor(my*(.7+Math.random()*.6));
  if(my>def){p.miner=currentUser;addLog('🎉 占领！','loot')}else addLog('💀 失败','dmg');
  renderMineralStatus();
};

function showShipDetail(id){
  const s=playerShips.find(x=>x.id===id);if(!s)return;
  const color=getQualityColor(s.tier);
  const ah=s.affixes?.length?s.affixes.map(a=>`<div style="font-size:.7rem;color:#9b59b6;">${a.name}: ${a.desc}</div>`).join(''):'<div style="color:#4a6080;font-size:.7rem;">无词条</div>';
  const pl=s.pos==='front'?'先锋':s.pos==='mid'?'中间':'后勤';
  showModal('🚀 战舰详情',`<div class="item"><span>名称</span><span style="color:${color};">${s.name}</span></div><div class="item"><span>等级</span><span>T${s.tier}</span></div><div class="item"><span>位置</span><span>${pl}</span></div><div class="item"><span>生命</span><span>${s.maxHp}</span></div><div class="item"><span>攻击</span><span>${s.atk}</span></div><div class="item"><span>锻造次数</span><span>${s.forgeCount||0}/5</span></div><div style="margin-top:8px;border-top:1px solid var(--bd);padding-top:6px;"><div style="font-size:.75rem;color:var(--ts);">词条 (${s.affixes?.length||0}/5)</div>${ah}</div><div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;">${s.deployed?`<button class="btn-sm" style="background:#4a1a1a;" onclick="hideModal();deployShip('${s.id}',false)">撤下</button>`:`<button class="btn-sm" style="background:#1a4a2a;" onclick="hideModal();deployShip('${s.id}',true)">上阵</button>`}<button class="btn-sm" style="background:#6a5a2a;" onclick="hideModal();forgeShip('${s.id}')">🔨 锻造 (10个T${s.tier})</button><button class="btn-sm" style="background:#2a2a4a;" onclick="hideModal()">关闭</button></div>`);
}
window.forgeShip=async function(id){
  const s=playerShips.find(x=>x.id===id);if(!s)return;
  if((s.forgeCount||0)>=5){addLog('❌ 已达最大锻造次数','dmg');return}
  const pool=ALL_MATERIALS.filter(m=>m.tier===s.tier);let um=null;
  for(const m of pool){if(inventory[m.name]&&inventory[m.name].count>=10){um=m;break}}
  if(!um){addLog('❌ 需要10个T'+s.tier+'材料','dmg');return}
  const result=await consumeItems({[um.name]:10},async()=>{
    const a=randomAffix();s.affixes.push(a);s.forgeCount=(s.forgeCount||0)+1;
    const base=getBaseStats(s.tier,s.pos);
    const hp=applyDeviation(base.hp,s.tier),atk=applyDeviation(base.atk,s.tier);
    s.baseHp=base.hp;s.baseAtk=base.atk;s.maxHp=hp;s.atk=atk;s.hp=Math.min(s.hp,s.maxHp);
    s.affixes.forEach(af=>{if(af.id==='heavy_armor'){s.maxHp=Math.floor(s.maxHp*(1+af.value/100));s.hp=Math.min(s.hp,s.maxHp)}if(af.id==='burst')s.atk=Math.floor(s.atk*(1-af.value/100));if(af.id==='focus')s.dmgBonus=(s.dmgBonus||0)+af.value/100;if(af.id==='plunder')s.plunder=(s.plunder||0)+af.value/100;if(af.id==='self_destruct')s.selfDestruct=(s.selfDestruct||0)+af.value/100});
    return true;
  });
  if(result.success){addLog('🔨 锻造成功！获得词条','affix');renderWarehouse();updateFleetUI();saveGameImmediate()}
  else addLog('❌ '+result.error,'dmg');
};
window.deployShip=function(id,dep){
  const s=playerShips.find(x=>x.id===id);if(!s)return;
  if(dep){const d=playerShips.filter(x=>x.deployed&&x.pos===s.pos);if(d.length>=maxShips[s.pos]){addLog('❌ 位置已满','dmg');return}s.deployed=true;addLog('✅ '+s.name+' 已上阵','sys')}
  else{s.deployed=false;addLog('📤 已撤下','sys')}
  updateFleetUI();saveGameImmediate();
};

document.getElementById('btnEditFleet').addEventListener('click',function(){
  let html='<div style="color:#6f8bb0;font-size:.7rem;margin-bottom:6px;">💡 点击卡片查看详情</div>';
  ['front','mid','rear'].forEach(pos=>{
    const labels={front:'⚔️ 先锋',mid:'💥 中间',rear:'💚 后勤'};
    const colors={front:'#e74c3c',mid:'#f1c40f',rear:'#2ecc71'};
    const ships=playerShips.filter(s=>s.pos===pos);const dep=ships.filter(s=>s.deployed).length;
    html+=`<div style="padding:4px;background:var(--bgp);border-radius:4px;border-left:3px solid ${colors[pos]};margin-bottom:4px;"><div style="font-size:.6rem;color:var(--ts);">${labels[pos]} (${dep}/${maxShips[pos]})</div>`;
    ships.forEach(s=>{
      const color=getQualityColor(s.tier);const ac=s.affixes?.length||0;
      html+=`<div class="ship-card" style="border-color:${color};margin-top:3px;"><div class="ship-info"><span style="color:${color};font-size:.6rem;">${s.name}</span><span style="font-size:.5rem;color:#6a8aaa;">T${s.tier} ❤${s.maxHp} ⚔${s.atk} ${ac>0?'['+ac+'词条]':''}</span></div><div class="ship-actions"><button class="btn-mini detail" onclick="hideModal();showShipDetail('${s.id}')">📋</button>${s.deployed?`<button class="btn-mini undeploy" onclick="hideModal();deployShip('${s.id}',false)">撤</button>`:`<button class="btn-mini deploy" onclick="hideModal();deployShip('${s.id}',true)">上</button>`}</div></div>`;
    });
    html+='</div>';
  });
  showModal('⚔️ 编辑战队',html);
});

document.getElementById('btnAlliance').addEventListener('click',showAllianceMain);

async function showAllianceMain(){
  const ad=await loadFromGist()||{};
  allianceData=ad.alliances||{};
  const list=Object.values(allianceData);
  let html=`
    <div style="display:flex;gap:6px;margin-bottom:8px;">
      <input type="text" id="allySearch" placeholder="搜索联盟..." oninput="filterAlliance()" style="flex:1;background:var(--bgi);border:1px solid var(--bd);border-radius:4px;padding:5px 10px;color:var(--th);font-size:.65rem;">
      <button class="btn-sm" style="background:#6a5a2a;padding:4px 12px;" onclick="showCreateAlliance()">+ 创建联盟</button>
    </div>
    <div class="alliance-list" id="allianceList">
  `;
  if(list.length===0)html+='<div style="text-align:center;color:#4a6080;padding:20px;">暂无联盟，快来创建第一个吧！</div>';
  else list.forEach(a=>{
    const lv=getAllianceLevel(a.reputation||0);
    html+=`<div class="alliance-item" data-name="${a.name}" onclick="showAllianceDetail('${a.name}')">
      <div class="a-name">🏛️ ${a.name}</div>
      <div class="a-info">等级：${lv} | 声望：${a.reputation||0} | 成员：${(a.members||[]).length}人 | 盟主：${a.leader}</div>
    </div>`;
  });
  html+='</div>';
  showModal('🏛️ 星际联盟',html);
}

window.filterAlliance=function(){
  const q=document.getElementById('allySearch').value.toLowerCase();
  document.querySelectorAll('#allianceList .alliance-item').forEach(el=>{
    const n=el.dataset.name.toLowerCase();
    el.style.display=n.includes(q)?'':'none';
  });
};

window.showCreateAlliance=function(){
  if(credits<10000){alert('需要 10000 星际币');return}
  const name=prompt('请输入联盟名称（不可重复）：');
  if(!name||name.length<2){alert('名称至少2个字符');return}
  if(allianceData[name]){alert('联盟名已存在');return}
  if(currentAlliance){alert('你已经在一个联盟中');return}
  credits-=10000;
  allianceData[name]={
    name,leader:currentUser,
    members:[{name:currentUser,contribution:0,joinTime:now()}],
    pending:[],reputation:0,
    warehouse:{},
    tasks:{}
  };
  currentAlliance=name;
  addLog('🏛️ 创建联盟成功：'+name,'loot');
  renderAll();saveGameImmediate();
  hideModal();
  setTimeout(showAllianceDetail.bind(null,name),300);
};

window.showAllianceDetail=async function(name){
  const ad=await loadFromGist()||{};
  allianceData=ad.alliances||{};
  const a=allianceData[name];if(!a){alert('联盟不存在');return}
  const isLeader=a.leader===currentUser;
  const isMember=(a.members||[]).some(m=>m.name===currentUser);
  const lv=getAllianceLevel(a.reputation||0);
  const myMember=a.members?.find(m=>m.name===currentUser);
  let html=`
    <div style="font-size:.85rem;color:#d4a843;font-weight:600;margin-bottom:6px;">🏛️ ${a.name}</div>
    <div style="font-size:.65rem;color:var(--ts);line-height:1.6;">
      等级：<span style="color:#4aad7a;">${lv}</span><br>
      声望：${a.reputation||0}<br>
      盟主：${a.leader}<br>
      成员：${(a.members||[]).length}人
    </div>
    <div style="margin-top:10px;display:flex;gap:4px;flex-wrap:wrap;">
  `;
  if(!isMember&&!isLeader){
    const isPending=(a.pending||[]).some(p=>p.name===currentUser);
    if(isPending)html+=`<button class="btn-sm" disabled>⏳ 已申请，等待审核</button>`;
    else html+=`<button class="btn-sm" style="background:#1f6a3a;" onclick="applyAlliance('${name}')">📝 申请加入</button>`;
  }
  if(isMember||isLeader){
    html+=`<button class="btn-sm" style="background:#2a5a7a;" onclick="showAllianceWarehouse('${name}')">📦 仓库</button>`;
    html+=`<button class="btn-sm" style="background:#4a2a6a;" onclick="showAllianceTasks('${name}')">📋 任务</button>`;
    html+=`<button class="btn-sm" style="background:#6a5a2a;" onclick="showAllianceContribute('${name}')">💰 捐献</button>`;
    html+=`<button class="btn-sm" style="background:#2a5a7a;" onclick="showAllianceMembers('${name}')">👥 成员</button>`;
  }
  if(isLeader){
    if((a.pending||[]).length>0)html+=`<button class="btn-sm" style="background:#6a2a2a;" onclick="showPending('${name}')">⏳ 待审核(${a.pending.length})</button>`;
    html+=`<button class="btn-sm" style="background:#8a2a2a;" onclick="disbandAlliance('${name}')">💥 解散联盟</button>`;
  }
  html+='</div>';
  showModal('🏛️ '+a.name,html);
};

window.applyAlliance=async function(name){
  const ad=await loadFromGist()||{};
  const a=ad.alliances?.[name];
  if(!a){alert('联盟不存在');return}
  if(a.leader===currentUser){alert('你是盟主');return}
  if(a.members?.some(m=>m.name===currentUser)){alert('你已是成员');return}
  if(a.pending?.some(p=>p.name===currentUser)){alert('已申请');return}
  if(!a.pending)a.pending=[];
  a.pending.push({name:currentUser,applyTime:now()});
  await saveToGist(ad);
  addLog('📝 已申请加入 '+name,'sys');
  hideModal();
  setTimeout(showAllianceDetail.bind(null,name),300);
};

window.showAllianceMembers=async function(name){
  const ad=await loadFromGist()||{};
  const a=ad.alliances?.[name];if(!a)return;
  const isLeader=a.leader===currentUser;
  let html='';
  (a.members||[]).forEach(m=>{
    const isL=a.leader===m.name;
    html+=`<div class="member-row"><span><span class="m-name">${m.name}</span>${isL?' <span class="m-leader">👑盟主</span>':''}</span><span class="m-contrib">贡献:${m.contribution||0}</span>${isLeader&&!isL?`<button class="m-action" onclick="kickMember('${name}','${m.name}')">踢出</button>`:''}</div>`;
  });
  showModal('👥 成员列表 ('+(a.members||[]).length+')',html);
};

window.showPending=async function(name){
  const ad=await loadFromGist()||{};
  const a=ad.alliances?.[name];if(!a)return;
  let html='';
  if(!a.pending||a.pending.length===0)html='<div style="text-align:center;color:#4a6080;padding:20px;">暂无待审核申请</div>';
  else a.pending.forEach(p=>{
    html+=`<div class="member-row"><span class="m-name">${p.name}</span><div><button class="m-action" style="background:#1f6a3a;" onclick="approveMember('${name}','${p.name}')">通过</button> <button class="m-action" onclick="rejectMember('${name}','${p.name}')">拒绝</button></div></div>`;
  });
  showModal('⏳ 待审核',html);
};

window.approveMember=async function(an,pn){
  const ad=await loadFromGist()||{};
  const a=ad.alliances?.[an];if(!a)return;
  if(a.leader!==currentUser){alert('只有盟主可以审核');return}
  a.pending=a.pending.filter(p=>p.name!==pn);
  a.members.push({name:pn,contribution:0,joinTime:now()});
  await saveToGist(ad);
  addLog('✅ '+pn+' 已加入联盟','sys');
  hideModal();setTimeout(showPending.bind(null,an),300);
};

window.rejectMember=async function(an,pn){
  const ad=await loadFromGist()||{};
  const a=ad.alliances?.[an];if(!a)return;
  a.pending=a.pending.filter(p=>p.name!==pn);
  await saveToGist(ad);
  hideModal();setTimeout(showPending.bind(null,an),300);
};

window.kickMember=async function(an,mn){
  const ad=await loadFromGist()||{};
  const a=ad.alliances?.[an];if(!a)return;
  if(a.leader!==currentUser){alert('只有盟主可以踢人');return}
  if(!confirm('确定踢出 '+mn+' 吗？'))return;
  a.members=a.members.filter(m=>m.name!==mn);
  await saveToGist(ad);
  addLog('👢 '+mn+' 已被踢出','sys');
  hideModal();setTimeout(showAllianceDetail.bind(null,an),300);
};

window.disbandAlliance=async function(name){
  const ad=await loadFromGist()||{};
  const a=ad.alliances?.[name];if(!a)return;
  if(a.leader!==currentUser){alert('只有盟主可以解散');return}
  if(!confirm('确定解散 '+name+'？此操作不可恢复！'))return;
  delete ad.alliances[name];
  await saveToGist(ad);
  if(currentAlliance===name)currentAlliance=null;
  addLog('💥 联盟已解散','dmg');
  hideModal();
};

window.showAllianceContribute=async function(name){
  const ad=await loadFromGist()||{};
  const a=ad.alliances?.[name];if(!a)return;
  if(a.leader!==currentUser&&!a.members?.some(m=>m.name===currentUser)){alert('不是成员');return}
  let html=`
    <div style="font-size:.7rem;color:var(--ts);margin-bottom:6px;">选择要捐献的物品（可捐献材料、蓝图、战舰）</div>
    <div style="max-height:400px;overflow-y:auto;">
    <div style="color:#d4a843;font-weight:600;font-size:.65rem;margin:6px 0;">📦 材料</div>
  `;
  Object.keys(inventory).forEach(mat=>{
    const d=inventory[mat];const cv=getMaterialContribution(d.tier);
    html+=`<div class="member-row"><span>${mat} <span style="color:#4a6080;font-size:.5rem;">(T${d.tier}, 有${d.count}个, 每个+${cv}贡献)</span></span><button class="m-action" style="background:#1f6a3a;" onclick="contributeMaterial('${name}','${mat}',1)">捐1</button></div>`;
  });
  const un=blueprints.filter(b=>!b.learned&&!b.used);
  if(un.length){
    html+='<div style="color:#d4a843;font-weight:600;font-size:.65rem;margin:6px 0;">📐 蓝图</div>';
    un.forEach(bp=>{
      const cv=getBlueprintContribution(bp.tier);
      html+=`<div class="member-row"><span>${bp.name} <span style="color:#4a6080;font-size:.5rem;">(T${bp.tier}, +${cv}贡献)</span></span><button class="m-action" style="background:#1f6a3a;" onclick="contributeBlueprint('${name}','${bp.id}')">捐献</button></div>`;
    });
  }
  const ships=playerShips.filter(s=>!s.deployed);
  if(ships.length){
    html+='<div style="color:#d4a843;font-weight:600;font-size:.65rem;margin:6px 0;">🚀 战舰(未上阵)</div>';
    ships.forEach(s=>{
      const cv=getShipContribution(s.tier);
      html+=`<div class="member-row"><span>${s.name} <span style="color:#4a6080;font-size:.5rem;">(T${s.tier}, +${cv}贡献)</span></span><button class="m-action" style="background:#1f6a3a;" onclick="contributeShip('${name}','${s.id}')">捐献</button></div>`;
    });
  }
  html+='</div>';
  showModal('💰 捐献 - '+name,html);
};

window.contributeMaterial=async function(an,mat,qty){
  if(!inventory[mat]||inventory[mat].count<qty){alert('数量不足');return}
  const ad=await loadFromGist()||{};
  const a=ad.alliances?.[an];if(!a)return;
  const tier=inventory[mat].tier;const cv=getMaterialContribution(tier)*qty;
  inventory[mat].count-=qty;if(inventory[mat].count<=0)delete inventory[mat];
  const me=a.members?.find(m=>m.name===currentUser);
  if(me)me.contribution=(me.contribution||0)+cv;
  const key=mat;if(!a.warehouse[key])a.warehouse[key]={name:mat,tier,count:0,contributor:currentUser,contribValue:getMaterialContribution(tier)};
  a.warehouse[key].count+=qty;
  await saveToGist(ad);
  addLog(`💰 捐献 ${mat} x${qty}，获得 ${cv} 贡献值`,'loot');
  renderWarehouse();saveGameImmediate();
  hideModal();setTimeout(()=>showAllianceContribute(an),300);
};

window.contributeBlueprint=async function(an,bid){
  const bp=blueprints.find(b=>b.id===bid);if(!bp||bp.learned||bp.used){alert('蓝图不可用');return}
  const ad=await loadFromGist()||{};
  const a=ad.alliances?.[an];if(!a)return;
  const cv=getBlueprintContribution(bp.tier);
  const me=a.members?.find(m=>m.name===currentUser);
  if(me)me.contribution=(me.contribution||0)+cv;
  const key='bp_'+bp.name;
  if(!a.warehouse[key])a.warehouse[key]={name:bp.name,tier:bp.tier,count:0,isBlueprint:true,contributor:currentUser,contribValue:cv};
  a.warehouse[key].count++;
  blueprints.splice(blueprints.indexOf(bp),1);
  await saveToGist(ad);
  addLog(`💰 捐献蓝图 ${bp.name}，获得 ${cv} 贡献值`,'loot');
  renderWarehouse();saveGameImmediate();
  hideModal();setTimeout(()=>showAllianceContribute(an),300);
};

window.contributeShip=async function(an,sid){
  const s=playerShips.find(x=>x.id===sid);if(!s||s.deployed){alert('战舰不可捐');return}
  const ad=await loadFromGist()||{};
  const a=ad.alliances?.[an];if(!a)return;
  const cv=getShipContribution(s.tier);
  const me=a.members?.find(m=>m.name===currentUser);
  if(me)me.contribution=(me.contribution||0)+cv;
  const key='ship_'+s.id;
  if(!a.warehouse[key])a.warehouse[key]={name:s.name,tier:s.tier,pos:s.pos,count:1,isShip:true,shipData:s,contributor:currentUser,contribValue:cv};
  playerShips.splice(playerShips.indexOf(s),1);
  await saveToGist(ad);
  addLog(`💰 捐献战舰 ${s.name}，获得 ${cv} 贡献值`,'loot');
  updateFleetUI();saveGameImmediate();
  hideModal();setTimeout(()=>showAllianceContribute(an),300);
};

window.showAllianceWarehouse=async function(name){
  const ad=await loadFromGist()||{};
  const a=ad.alliances?.[name];if(!a)return;
  const me=a.members?.find(m=>m.name===currentUser);
  const myContrib=me?.contribution||0;
  let html=`<div style="font-size:.65rem;color:#d4a843;margin-bottom:6px;">你的贡献值：${myContrib}</div>`;
  html+='<div style="max-height:400px;overflow-y:auto;">';
  const items=Object.keys(a.warehouse||{});
  if(items.length===0)html+='<div style="text-align:center;color:#4a6080;padding:20px;">仓库空空如也</div>';
  else items.forEach(key=>{
    const it=a.warehouse[key];
    const canBuy=myContrib>=it.contribValue&&it.contributor!==currentUser;
    html+=`<div class="member-row"><span>${it.isBlueprint?'📐':it.isShip?'🚀':'📦'} ${it.name} <span style="color:#4a6080;font-size:.5rem;">(T${it.tier}, ${it.count}个, ${it.contribValue}贡献, 由${it.contributor}捐献)</span></span>${it.contributor===currentUser?'<span style="color:#4a6080;font-size:.5rem;">自己的</span>':`<button class="m-action" style="background:${canBuy?'#1f6a3a':'#4a6080'};" ${canBuy?`onclick="buyFromAlliance('${name}','${key}')"`:'disabled'}>花${it.contribValue}购买</button>`}</div>`;
  });
  html+='</div>';
  showModal('📦 联盟仓库 - '+name,html);
};

window.buyFromAlliance=async function(an,key){
  const ad=await loadFromGist()||{};
  const a=ad.alliances?.[an];if(!a)return;
  const it=a.warehouse[key];if(!it){alert('物品不存在');return}
  const me=a.members?.find(m=>m.name===currentUser);
  if(!me||me.contribution<it.contribValue){alert('贡献值不足');return}
  if(it.contributor===currentUser){alert('不能购买自己的');return}
  me.contribution-=it.contribValue;
  const seller=a.members?.find(m=>m.name===it.contributor);
  if(seller)seller.contribution=(seller.contribution||0)+it.contribValue;
  if(it.isBlueprint){
    blueprints.push({id:'bp_'+Date.now()+Math.random().toString(36).substr(2,4),name:it.name,tier:it.tier,pos:'front',used:false,learned:false});
  }else if(it.isShip){
    playerShips.push({...it.shipData,id:'ship_'+Date.now()+Math.random().toString(36).substr(2,4),deployed:false});
  }else{
    if(inventory[it.name])inventory[it.name].count+=1;else inventory[it.name]={count:1,tier:it.tier};
  }
  it.count--;
  if(it.count<=0)delete a.warehouse[key];
  await saveToGist(ad);
  addLog(`🛒 购买了 ${it.name}，花费 ${it.contribValue} 贡献`,'loot');
  renderWarehouse();saveGameImmediate();
  hideModal();setTimeout(()=>showAllianceWarehouse(an),300);
};

window.showAllianceTasks=async function(name){
  const ad=await loadFromGist()||{};
  const a=ad.alliances?.[name];if(!a)return;
  const today=getToday();
  if(!a.tasks)a.tasks={};
  if(!a.tasks[today])a.tasks[today]={};
  if(!a.tasks[today][currentUser]){
    // 生成7个任务
    const tasks={};
    for(let tier=1;tier<=7;tier++){
      const pool=ALL_MATERIALS.filter(m=>m.tier===tier);
      const mat=pool[Math.floor(Math.random()*pool.length)];
      const qty=1+Math.floor(Math.random()*3);
      tasks['T'+tier]={material:mat.name,tier,qty,completed:false,reward:getTaskReward(tier)};
    }
    a.tasks[today][currentUser]=tasks;
    await saveToGist(ad);
  }
  const tasks=a.tasks[today][currentUser];
  let html=`<div style="font-size:.65rem;color:var(--ts);margin-bottom:6px;">今日任务（每天0点刷新）</div>`;
  for(let tier=1;tier<=7;tier++){
    const t=tasks['T'+tier];if(!t)continue;
    const has=inventory[t.material]?.count>=t.qty;
    html+=`<div class="task-row"><span>T${tier}: 上交 ${t.material} ×${t.qty} <span class="t-reward">+${t.reward}💰 +1声望</span></span>${t.completed?'<span style="color:#4aad7a;">✅已完成</span>':`<button class="t-btn" ${has?'':'disabled'} onclick="completeTask('${name}','T${tier}')">${has?'上交':'材料不足'}</button>`}</div>`;
  }
  showModal('📋 每日任务 - '+name,html);
};

window.completeTask=async function(an,tk){
  const ad=await loadFromGist()||{};
  const a=ad.alliances?.[an];if(!a)return;
  const today=getToday();
  const t=a.tasks?.[today]?.[currentUser]?.[tk];
  if(!t||t.completed){alert('任务已完成');return}
  if(!inventory[t.material]||inventory[t.material].count<t.qty){alert('材料不足');return}
  inventory[t.material].count-=t.qty;
  if(inventory[t.material].count<=0)delete inventory[t.material];
  t.completed=true;
  credits+=t.reward;
  a.reputation=(a.reputation||0)+1;
  await saveToGist(ad);
  addLog(`✅ 完成任务 ${tk}，获得 ${t.reward} 星际币，联盟+1声望`,'loot');
  document.getElementById('creditDisplay').textContent=credits;
  renderWarehouse();saveGameImmediate();
  hideModal();setTimeout(()=>showAllianceTasks(an),300);
};
